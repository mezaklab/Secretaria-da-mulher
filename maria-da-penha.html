<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOS Maria da Penha - Secretaria da Mulher</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#f6f2f8] min-h-screen flex flex-col font-sans">
    
    <div class="w-full p-6 md:p-8">
        <a href="index.html" class="inline-flex items-center gap-2 text-purple-700 font-semibold hover:text-purple-900 transition-colors text-lg">
            <i class="fas fa-arrow-left"></i> Voltar
        </a>
    </div>

    <main class="flex-grow flex items-center justify-center p-6 md:p-8">
        <img src="/public/sos-maria-da-penha.png" alt="SOS Maria da Penha" class="w-full max-w-4xl mx-auto h-auto rounded-lg shadow-lg" />
    </main>


    <!-- Banner de Privacidade/Cookies -->
    <div id="cookieBanner" class="fixed bottom-0 left-0 w-full bg-slate-900/95 backdrop-blur-sm text-white z-50 transform translate-y-full transition-transform duration-500 shadow-2xl border-t border-purple-500/20 hidden">
        <div class="max-w-7xl mx-auto px-6 py-4 md:py-6 flex flex-col md:flex-row items-center justify-between gap-4 md:gap-8">
            <div class="text-sm md:text-base text-slate-200 flex-grow text-center md:text-left">
                <p>Nós valorizamos sua privacidade. Utilizamos apenas cookies essenciais para o funcionamento seguro dos formulários, sem rastreamento publicitário. Ao continuar, você concorda com nossa <a href="politica-privacidade.html" class="text-purple-300 font-bold hover:text-white underline transition-colors">Política de Privacidade</a>.</p>
            </div>
            <button id="btnAcceptCookies" class="shrink-0 w-full md:w-auto px-8 py-3 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded-xl transition-colors shadow-lg">
                Entendi
            </button>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const banner = document.getElementById('cookieBanner');
            const btnAccept = document.getElementById('btnAcceptCookies');
            
            if (localStorage.getItem('cookiesAceitos') !== '1') {
                banner.classList.remove('hidden');
                // Pequeno delay para a animação de subida funcionar
                setTimeout(() => {
                    banner.classList.remove('translate-y-full');
                }, 100);
            }

            btnAccept.addEventListener('click', () => {
                localStorage.setItem('cookiesAceitos', '1');
                banner.classList.add('translate-y-full');
                setTimeout(() => {
                    banner.classList.add('hidden');
                }, 500); // tempo da transição
            });
        });
    </script>
</body>
</html>
